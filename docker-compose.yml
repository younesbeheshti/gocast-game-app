services:
  postgres:
    image: postgres:16-alpine
    container_name: gocast-game-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gocast_game

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - game_app

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskbridge"]
      interval: 10s
      timeout: 5s
      retries: 5


  game_app_redis:
    image: redis:7-alpine
    container_name: game_app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - game_app
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data:

networks:
  game_app:
    driver: bridge
